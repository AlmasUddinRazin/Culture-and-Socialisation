<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sociology MCQ Trainer</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2233;--mute:#667085;--line:#e3e6ef;--brand:#3b5bdb;--brand2:#e8edff;--ok:#12805c;--okbg:#e6f6ef;--bad:#c92a2a;--badbg:#fdecec;--warn:#b7791f;--warnbg:#fff6e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,#27338f,#3b5bdb);color:#fff;padding:18px 16px 0}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 12px;font-size:13px;opacity:.85}
nav{display:flex;gap:4px;max-width:900px;margin:0 auto;overflow-x:auto}
nav button{flex:1;min-width:84px;background:transparent;border:0;color:#dfe5ff;padding:10px 8px;font-size:15px;cursor:pointer;border-radius:10px 10px 0 0}
nav button.on{background:var(--bg);color:var(--brand);font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.pill{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:13px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn{background:var(--brand);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}
.btn.sec{background:var(--brand2);color:var(--brand)}
.btn.red{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{font-size:12px;color:var(--brand);background:var(--brand2);padding:2px 9px;border-radius:99px}
.q{font-size:18px;font-weight:600;margin:10px 0 12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt b{display:inline-block;width:24px;color:var(--mute)}
.exp{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.exp .e{background:var(--okbg);border-radius:10px;padding:10px 12px;font-size:15px}
.exp .t{background:var(--warnbg);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:8px}
.exp small{display:block;font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;font-size:11px;color:var(--mute)}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;color:var(--ink)}
.dot.cur{outline:2px solid var(--brand)}
.dot.ok{background:var(--okbg);border-color:var(--ok)}
.dot.bad{background:var(--badbg);border-color:var(--bad)}
.dot.ans{background:var(--brand2);border-color:var(--brand)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--mute)}
input[type=text],input[type=password]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;margin:4px 0 10px}
label{font-size:13px;font-weight:600;color:var(--mute)}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.err{background:var(--badbg);color:var(--bad)}.msg.inf{background:var(--brand2);color:var(--brand)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand)}
.timer.low{color:var(--bad)}
.star{background:none;border:0;font-size:22px;cursor:pointer;color:#c4c9d8}
.star.on{color:#f59f00}
h2{margin:0 0 8px;font-size:18px}
.muted{color:var(--mute);font-size:14px}
.rv{border-left:4px solid var(--line)}
.rv.ok{border-left-color:var(--ok)}.rv.bad{border-left-color:var(--bad)}
@media(max-width:520px){.q{font-size:17px}.dot{width:30px;height:30px}}
</style>
</head>

<script>
const PRACTICE=[{"ch":"Culture","q":"Sociologically, culture is best defined as…","o":["Only fine arts and refined taste","Learned, socially transmitted customs, knowledge, objects and behavior","Inherited genetic traits","The laws of a state"],"a":1,"e":"Culture is the totality of learned, socially transmitted customs, knowledge, material objects and behavior.","t":"Slang, ice-cream cones and rock music count as culture — not just Rembrandt.","id":"p1"},{"ch":"Culture","q":"Horace Miner's 'Nacirema' is really…","o":["A Pacific island tribe","'American' spelled backward","An African kingdom","The Amish"],"a":1,"e":"Miner described U.S. body rituals as if studying an exotic tribe.","t":"Article: 'Body Ritual among the Nacirema' (1956).","id":"p2"},{"ch":"Culture","q":"In Miner's essay, the Nacirema 'shrine' is the…","o":["Church","Kitchen","Bathroom","Bedroom"],"a":2,"e":"The shrine = bathroom; charms and potions = beauty products and drugs.","t":"Number of bathrooms = a measure of wealth in the essay.","id":"p3"},{"ch":"Culture","q":"Eating disorders rose among young Fijians after…","o":["Cable TV arrived in 1995","A famine","War","Tourism ban"],"a":0,"e":"Young women began copying thin TV stars instead of their mothers and aunts.","t":"Traditionally in Fiji, 'You've gained weight' was a compliment.","id":"p4"},{"ch":"Culture","q":"A society is…","o":["Any group of friends","People in the same territory, fairly independent, sharing a culture","Any city","A nation's government"],"a":1,"e":"A society is the largest form of human group, sharing heritage and culture.","t":"Metro Los Angeles is NOT a society — it is part of the U.S.","id":"p5"},{"ch":"Culture","q":"The worldwide 'culture industry' idea comes from…","o":["Theodor Adorno","Max Weber","Emile Durkheim","George Murdock"],"a":0,"e":"Adorno argued mass media standardizes goods and limits choices.","t":"Adorno was a German philosopher; Horkheimer co-wrote with him.","id":"p6"},{"ch":"Culture","q":"Baseball in Finland differs from North America because…","o":["It has no bat","Pitcher stands beside the batter and runner goes to 'third' first","It's played on ice","It has no teams"],"a":1,"e":"It evolved differently after introduction in 1907 but is still a vital part of Finnish culture.","t":"Baseball is Finland's 2nd most popular sport after ice hockey.","id":"p7"},{"ch":"Culture","q":"Swidler's 'tool kit' means culture gives people…","o":["Habits, skills and styles to build their lives","Machines only","Money","Genes"],"a":0,"e":"People use a common tool kit of habits, skills and styles.","t":"Without social transmission each generation would reinvent the wheel.","id":"p8"},{"ch":"Culture","q":"Cultural universals are…","o":["Practices found in every culture","Rules found in one country","Genetic traits","Slang words"],"a":0,"e":"They often meet essential needs like food, shelter and clothing.","t":"Concept compiled by George Murdock.","id":"p9"},{"ch":"Culture","q":"Which is on Murdock's list of cultural universals?","o":["Funeral ceremonies","Video games","Stock markets","Passports"],"a":0,"e":"His list includes sports, cooking, dancing, marriage, medicine, funeral ceremonies, trade.","t":"Murdock (1945:124).","id":"p10"},{"ch":"Culture","q":"Marriage is universal, but some societies choose partners freely and others arrange them. This shows…","o":["Expression of universals varies","Universals don't exist","Marriage is genetic","Culture lag"],"a":0,"e":"The practice is universal; its form differs.","t":"Universals can also change over time within a society.","id":"p11"},{"ch":"Culture","q":"Who coined 'ethnocentrism'?","o":["William Graham Sumner","Max Weber","Charles Darwin","Robert Merton"],"a":0,"e":"Sumner (1906) used it for judging other cultures by one's own as the norm.","t":"Terms like 'primitive' and 'backward' reflect it.","id":"p12"},{"ch":"Culture","q":"Looking down on India's sacred-cow tradition is an example of…","o":["Ethnocentrism","Cultural relativism","Diffusion","Innovation"],"a":0,"e":"The observer treats own norms (cattle as food) as the standard.","t":"Ethnocentrism is not limited to the U.S.","id":"p13"},{"ch":"Culture","q":"Cultural relativism means…","o":["Viewing behavior from the perspective of its own culture","Rejecting all cultures","Copying other cultures","Superiority of one culture"],"a":0,"e":"It prioritizes understanding over dismissing as 'strange'.","t":"Linked to Max Weber's value neutrality.","id":"p14"},{"ch":"Culture","q":"In 2006 the U.S. government spent how much to discourage child marriage abroad?","o":["$62 million","$623 million","$6 billion","$23 million"],"a":1,"e":"The spending raised relativism-versus-intervention questions.","t":"Child marriage is common in West Africa and South Asia.","id":"p15"},{"ch":"Culture","q":"U.S. officials say child marriage harms girls by…","o":["Depriving education, harming health, weakening HIV efforts","Raising taxes","Lowering literacy of boys","Increasing trade"],"a":0,"e":"They defended the spending on those grounds.","t":"Figure 3-1 (UNICEF 2014).","id":"p16"},{"ch":"Culture","q":"Sociobiology is the study of…","o":["How biology affects human social behavior","Social class","Language change","Urban growth"],"a":0,"e":"It stresses universal aspects of culture.","t":"Sociology stresses diversity and change.","id":"p17"},{"ch":"Culture","q":"Sociobiology is founded on whose theory?","o":["Darwin's evolution","Marx's class struggle","Freud's psychoanalysis","Mead's self"],"a":0,"e":"Natural selection applied to social behavior.","t":"Darwin (1859).","id":"p18"},{"ch":"Culture","q":"Natural selection is adaptation through…","o":["Random genetic variation","Learning","Laws","Trade"],"a":0,"e":"Advantageous variations spread because carriers survive and reproduce.","t":"Darwin's example: shape of bird beaks.","id":"p19"},{"ch":"Culture","q":"Conflict theorists fear sociobiology could be used…","o":["Against efforts to assist disadvantaged people","To promote bilingualism","To expand trade","To spread slang"],"a":0,"e":"It might justify inequality as 'natural'.","t":"Most sociologists say behavior, not genes, defines social reality.","id":"p20"},{"ch":"Culture","q":"Pierre Bourdieu's 'cultural capital' refers to…","o":["Noneconomic assets like family background and education","Money in banks","Government funds","Real estate"],"a":0,"e":"Shown in knowledge of language and the arts.","t":"Recalled from Chapter 1.","id":"p21"},{"ch":"Culture","q":"About how many languages are spoken in the world today?","o":["700","7,000","70","70,000"],"a":1,"e":"Far more than the number of countries.","t":"Each is fundamental to its speakers' culture.","id":"p22"},{"ch":"Culture","q":"English uses many war terms ('bombing' an exam). This suggests…","o":["Militarism's prominence in our culture","Peaceful values","Weak language","Sami influence"],"a":0,"e":"Language reflects what matters in a culture.","t":"An outside observer could gauge this from our words.","id":"p23"},{"ch":"Culture","q":"The Sami of northern Norway and Sweden have rich terms for…","o":["Snow, ice and reindeer","Rice","Ocean fish","Coffee"],"a":0,"e":"Language shapes what people notice.","t":"Used to illustrate the Sapir-Whorf idea.","id":"p24"},{"ch":"Culture","q":"Language is…","o":["An abstract system of word meanings and symbols","Only speech","Only writing","A genetic trait"],"a":0,"e":"It includes speech, characters, numerals, symbols and gestures.","t":"It's the foundation of every culture.","id":"p25"},{"ch":"Culture","q":"The Sapir-Whorf hypothesis holds that…","o":["Language precedes thought","Thought precedes language","Language is genetic","Language never changes"],"a":0,"e":"Language organizes how we interpret reality.","t":"Sapir 1929.","id":"p26"},{"ch":"Culture","q":"The Navajo phrase for cancer literally means…","o":["'The sore that does not heal'","'Sacred sickness'","'Bad blood'","'Long sleep'"],"a":0,"e":"Health educators worry it sounds like a death sentence.","t":"Navajo also believe talking about a disease brings it on.","id":"p27"},{"ch":"Culture","q":"Terms like mailman, policeman and fireman show…","o":["Gender-related language shaping occupations","Nonverbal communication","Diffusion","Folkways"],"a":0,"e":"They imply jobs are only for males.","t":"Feminists favor nonsexist language.","id":"p28"},{"ch":"Culture","q":"In much of Africa, small farmers use texting mainly to…","o":["Check commodity prices","Watch films","Play games","Date"],"a":0,"e":"Texting performs vital economic tasks.","t":"Researchers study how texting varies across cultures.","id":"p29"},{"ch":"Culture","q":"A high-five after winning is an example of…","o":["Nonverbal communication","Formal norm","Mores","Invention"],"a":0,"e":"Gestures and expressions are learned, not inborn.","t":"Fridlund et al. 1987.","id":"p30"},{"ch":"Culture","q":"In Australia, the thumbs-up sign is considered…","o":["Rude","Polite","Neutral","A greeting"],"a":0,"e":"Hand-signal meanings vary by culture.","t":"Symbols may not carry the same meaning everywhere.","id":"p31"},{"ch":"Culture","q":"Men holding hands after a business deal is acceptable in…","o":["Saudi Arabia","Canada","Norway","Mexico City"],"a":0,"e":"Touching norms differ widely.","t":"Egyptian men also walk hand in hand.","id":"p32"},{"ch":"Culture","q":"Which is a symbol?","o":["A smiley face in e-mail","A tree","A river","A rock"],"a":0,"e":"Symbols are gestures, objects or words that form the basis of communication.","t":"A cross can mean reverence, belief in everlasting life, or hatred.","id":"p33"},{"ch":"Culture","q":"The 9/11 memorial design 'Reflecting Absence' is by…","o":["Michael Arad","Frank Gehry","Maya Lin","Daniel Libeskind"],"a":0,"e":"Two sunken squares sit in the footprints of the towers.","t":"Names are grouped as 'meaningful adjacencies'.","id":"p34"},{"ch":"Culture","q":"Norms are…","o":["Established standards of behavior maintained by a society","Personal habits","Genetic urges","Only laws"],"a":0,"e":"To matter, they must be widely shared and understood.","t":"Silence in movie theaters is a norm.","id":"p35"},{"ch":"Culture","q":"Formal norms are…","o":["Written down with strict punishments","Unspoken","Only religious","Optional"],"a":0,"e":"Laws are the prime example.","t":"Parking rules and sports rules are formal norms too.","id":"p36"},{"ch":"Culture","q":"Donald Black called law…","o":["Governmental social control","Social contract","Class tool","Folkway"],"a":0,"e":"Laws are formal norms enforced by the state.","t":"Black (1995).","id":"p37"},{"ch":"Culture","q":"Proper dress standards are an example of…","o":["Informal norms","Formal norms","Mores","Laws"],"a":0,"e":"Violation brings no official punishment; laughter is typical.","t":"Informal norms are generally understood, not recorded.","id":"p38"},{"ch":"Culture","q":"Mores are…","o":["Norms deemed highly necessary to society's welfare","Everyday habits","Slang","Rituals"],"a":0,"e":"Violation brings severe penalties.","t":"Strong U.S. mores: against murder, treason, child abuse.","id":"p39"},{"ch":"Culture","q":"Walking up a down escalator breaks a…","o":["Folkway","More","Law","Value"],"a":0,"e":"Folkways govern everyday behavior; violations raise little concern.","t":"Society seldom formalizes folkways.","id":"p40"},{"ch":"Culture","q":"Sanctions are…","o":["Penalties and rewards for conduct","Only punishments","Only laws","Only gifts"],"a":0,"e":"Rewards count: a pay raise or a medal is a positive sanction.","t":"Note the 'reward' part of the definition.","id":"p41"},{"ch":"Culture","q":"Which is a formal negative sanction?","o":["Jail sentence","Frown","Compliment","Smile"],"a":0,"e":"Table 3-1 pairs formal norms with formal sanctions.","t":"Informal negatives: frown, humiliation, bullying.","id":"p42"},{"ch":"Culture","q":"A coach sends a 12th player onto the field. The team gets…","o":["A 15-yard penalty","A medal","Ignored","Praise"],"a":0,"e":"Formal norm, formal sanction.","t":"Example in the 'Norms and Sanctions' section.","id":"p43"},{"ch":"Culture","q":"Underage drinkers who follow peer standards are…","o":["Conforming to their group's norms","Breaking all norms","Using formal norms","Mores-driven"],"a":0,"e":"Behavior may violate society's norms yet follow a group's.","t":"Same with executives using shady accounting under corporate culture.","id":"p44"},{"ch":"Culture","q":"Helping a woman being beaten vs minding your own business shows…","o":["Norms can conflict","Norms never conflict","Folkways","Culture lag"],"a":0,"e":"One norm is violated to follow another.","t":"Acceptance of norms also changes over time.","id":"p45"},{"ch":"Culture","q":"Until the 1960s, formal norms in much of the U.S. prohibited…","o":["Interracial marriage","Voting","Cohabitation","Driving"],"a":0,"e":"Over half a century these legal bans were cast aside.","t":"Shows norms change with social conditions.","id":"p46"},{"ch":"Culture","q":"Parents' teaching about sexual orientation reflects…","o":["Heterosexuality as the dominant norm","No norms","Multiculturalism","Sociobiology"],"a":0,"e":"One in five mothers taught young children homosexuality is wrong (K. Martin 2009).","t":"Queer theorists stress this socialization.","id":"p47"},{"ch":"Culture","q":"In Iraq after 2003, pat-downs violated the norm against…","o":["Touching by strangers","Wearing veils","Praying","Trading"],"a":0,"e":"Women were searched by women to reduce discomfort.","t":"Shows sudden violation of long-standing norms.","id":"p48"},{"ch":"Culture","q":"Cultural values are…","o":["Collective conceptions of what is good, desirable and proper","Written rules","Penalties","Slang"],"a":0,"e":"They are criteria for evaluating others' actions.","t":"Not all members share all values.","id":"p49"},{"ch":"Culture","q":"Robin Williams's list of basic U.S. values includes…","o":["Achievement, efficiency, material comfort","Poverty","Collectivism","Isolation"],"a":0,"e":"A starting point for defining national character.","t":"Williams (1970).","id":"p50"},{"ch":"Culture","q":"The annual survey of first-year college students covers about…","o":["142,000 students","14,200","1.4 million","1,420"],"a":0,"e":"At nearly 200 four-year colleges.","t":"Cited as a barometer of national values.","id":"p51"},{"ch":"Culture","q":"'Being very well-off financially' as a goal rose from 42% (1966) to…","o":["82% (2015)","50%","62%","95%"],"a":0,"e":"Strongest gain among the values listed.","t":"Figure 3-2.","id":"p52"},{"ch":"Culture","q":"'Helping to promote racial understanding' peaked at 46% in…","o":["1992","1966","2015","1980"],"a":0,"e":"It leveled off at 41.2% by 2015.","t":"Support for altruism declined while money values rose.","id":"p53"},{"ch":"Culture","q":"Interest in cleaning the environment fell to ~20% by the 1980s and was ___ in 2015.","o":["28.8%","60%","46%","5%"],"a":0,"e":"Even with climate-change attention it remained low.","t":"Peak was nearly 46%.","id":"p54"},{"ch":"Culture","q":"According to the International Center for Academic Integrity, ___ of undergraduates admit cheating.","o":["68%","20%","43%","90%"],"a":0,"e":"43% of graduate students admit it.","t":"Box 3-2 'A Culture of Cheating?'","id":"p55"},{"ch":"Culture","q":"The 'Culture of Cheating' box says increased cheating reflects…","o":["Public examples where the end justifies the means","Better teaching","Honor codes","Less technology"],"a":0,"e":"Sports heroes, authors and executives caught cheating.","t":"Colleges respond with new honor codes.","id":"p56"},{"ch":"Culture","q":"Japan's 'cram schools' are valued, but in South Korea…","o":["Government regulated them from 2008","They're banned","They're free","They're unknown"],"a":0,"e":"Complaints that they favor affluent students.","t":"Shows values differ between cultures.","id":"p57"},{"ch":"Culture","q":"'Culture war' originally (1990s) described debates over…","o":["Abortion, gun control, religious expression, sexual orientation","Trade","Language","Diets"],"a":0,"e":"After 9/11 it took on a global meaning.","t":"Term popularized by James Davison Hunter (1991).","id":"p58"},{"ch":"Culture","q":"After the Iraq and Afghanistan presence, foreign opinion of the U.S. became…","o":["Quite negative","Very positive","Neutral","Unchanged"],"a":0,"e":"Through 2000, views were favorable even in Morocco and Germany.","t":"Kohut et al. surveys.","id":"p59"},{"ch":"Culture","q":"Shalom Schwartz found which value widely shared worldwide?","o":["Benevolence","Power","Wealth","Conformity"],"a":0,"e":"Defined as forgiveness and loyalty; power endorsed far less.","t":"Measured in 60+ countries.","id":"p60"},{"ch":"Culture","q":"The 'clash of civilizations' thesis is associated with…","o":["Samuel Huntington","Karl Marx","Erving Goffman","Georg Lukacs"],"a":0,"e":"Cultural/religious identities are the main source of conflict.","t":"Critics: it hides divisions within groups.","id":"p61"},{"ch":"Culture","q":"Functionalists see culture as…","o":["Providing stability through consensus and central values","Serving elites","Gendered","Meaningless"],"a":0,"e":"Traits persist if they serve social needs.","t":"Borrowed from British anthropologists.","id":"p62"},{"ch":"Culture","q":"Conflict theorists say a common culture…","o":["Maintains privileges of certain groups","Always unites","Is irrelevant","Is genetic"],"a":0,"e":"Powerful groups control wealth and beliefs.","t":"Dominant ideology is central.","id":"p63"},{"ch":"Culture","q":"The concept of dominant ideology was first used by…","o":["Lukacs and Gramsci","Weber and Sumner","Mead and Cooley","Ogburn and Ritzer"],"a":0,"e":"Marxists; it reached U.S. audiences in the early 1970s.","t":"Marx: capitalist ideology serves the ruling class.","id":"p64"},{"ch":"Culture","q":"Feminists argue dominant ideology…","o":["Keeps women subordinate to men","Frees women","Ignores gender","Favors bilingualism"],"a":0,"e":"Institutions tell women they should be subservient.","t":"Culture 'reflects society's view of men and women'.","id":"p65"},{"ch":"Culture","q":"A subculture is…","o":["A segment sharing distinctive customs differing from the larger society","A criminal gang","A language","A nation"],"a":0,"e":"Examples: rodeo riders, offshore oil-rig workers.","t":"Typical of complex societies.","id":"p66"},{"ch":"Culture","q":"'King Kong vault' and 'tic tac' belong to the argot of…","o":["Parkour","Surfing","Chess","Golf"],"a":0,"e":"Argot = specialized language of a subculture.","t":"It excludes outsiders and builds identity.","id":"p67"},{"ch":"Culture","q":"Indian call-center workers take days off on…","o":["U.S. holidays","Diwali","Eid","Local holidays"],"a":0,"e":"This isolates them from family and builds a subculture.","t":"They live in 'virtual migration'.","id":"p68"},{"ch":"Culture","q":"A counterculture…","o":["Deliberately opposes aspects of the larger culture","Supports all norms","Is a nation","Is a law"],"a":0,"e":"Example: 1960s hippies rejecting materialism.","t":"Opposed the Vietnam War.","id":"p69"},{"ch":"Culture","q":"Countercultures thrive most among…","o":["The young","The elderly","Judges","Retirees"],"a":0,"e":"They have the least investment in the existing culture.","t":"A 20-year-old adjusts more easily than a 60-year-old (Zellner 1995).","id":"p70"},{"ch":"Culture","q":"Ultraconservative militias such as the Ohio Defense Force are…","o":["Countercultures","Cultural universals","Dominant ideology","Folkways"],"a":0,"e":"Antigovernment, secretive and well armed.","t":"Watchdogs count 1,274 antigovernment groups (SPLC 2015).","id":"p71"},{"ch":"Culture","q":"Culture shock is…","o":["Disorientation in an unfamiliar culture","A film","A law","A value"],"a":0,"e":"It can be mutual — hosts are shocked too.","t":"Toilet slippers in a Japanese living room.","id":"p72"},{"ch":"Culture","q":"Innovation has two forms:","o":["Discovery and invention","Diffusion and lag","Norms and values","Mores and folkways"],"a":0,"e":"Introducing a new idea or object into a culture.","t":"Sociologists care about its social consequences.","id":"p73"},{"ch":"Culture","q":"Finding the structure of DNA is an example of…","o":["Discovery","Invention","Diffusion","Culture lag"],"a":0,"e":"Discovery makes known an existing aspect of reality.","t":"Another: a new moon of Saturn.","id":"p74"},{"ch":"Culture","q":"Which is an invention?","o":["The automobile","DNA structure","A new moon","Gravity"],"a":0,"e":"Invention combines existing items into something new.","t":"Also: bow and arrow, TV, Protestantism, democracy.","id":"p75"},{"ch":"Culture","q":"Diffusion is…","o":["Spread of a cultural item from group to group","Creation of a new item","Loss of language","A law"],"a":0,"e":"Via exploration, conquest, missionaries, media, tourism, Internet, fast food.","t":"Big Toe Crew hip-hop example.","id":"p76"},{"ch":"Culture","q":"'McDonaldization of society' was coined by…","o":["George Ritzer","Gerhard Lenski","William Ogburn","Donald Black"],"a":0,"e":"Fast-food principles dominate more sectors (walk-in clinics).","t":"Even religious groups use marketing like Happy Meals.","id":"p77"},{"ch":"Culture","q":"Mega Tamago Burger (Japan) and McAloo Tikki (India) show McDonald's…","o":["Adapting menus locally","Failing abroad","Banning beef","Ignoring locals"],"a":0,"e":"After false starts it relied on local advice.","t":"Until 2001 overseas operations were run from suburban Chicago.","id":"p78"},{"ch":"Culture","q":"In 2013 McDonald's opened vegetarian-only restaurants in…","o":["India","Japan","Brazil","France"],"a":0,"e":"Some strict vegetarians refuse to eat among non-vegetarians.","t":"Over 3,700 restaurants in Japan.","id":"p79"},{"ch":"Culture","q":"Gerhard Lenski defined technology as…","o":["Cultural information about using resources to satisfy needs","Machines only","Computers","Science"],"a":0,"e":"Technology also transmits culture.","t":"English and North American culture dominate the Web.","id":"p80 cond language was a common one like Spanish.","t":"Flores et al. 2012; two Massachusetts hospitals.","id":"p88"},{"ch":"Culture","q":"About 61 million U.S. residents (21%) speak…","o":["A non-English language at home","Only English","Spanish only","Chinese only"],"a":0,"e":"29 other languages each have 200,000+ speakers.","t":"National average 20.8% (2011 ACS).","id":"p89"},{"ch":"Culture","q":"California's 1998 proposition required English instruction for…","o":["1.4 million children","14,000","140,000","14 million"],"a":0,"e":"It all but eliminated bilingual education.","t":"Mixed results afterward.","id":"p90"},{"ch":"Culture","q":"The Johns Hopkins review of 17 studies found students taught in both languages…","o":["Progress better than English-only students","Do worse","Show no change","Drop out more"],"a":0,"e":"R. Slavin and Cheung 2003.","t":"Quality of bilingual programs varies widely.","id":"p91"},{"ch":"Socialisation","q":"The Wolfpack documentary by Crystal Moselle is about…","o":["Six brothers raised in isolation in a Manhattan apartment","A tribe in Brazil","Amish teens","Romanian orphans"],"a":0,"e":"The Angulo brothers learned about the world mostly from movies and TV.","t":"They transcribed films like Reservoir Dogs and The Dark Knight on a typewriter.","id":"p92"},{"ch":"Socialisation","q":"The Angulo brothers' first big film obsession began with…","o":["Pulp Fiction","Titanic","Star Wars","Frozen"],"a":0,"e":"They saw it on TV; it started their Quentin Tarantino obsession.","t":"They re-worked clothes into costumes, e.g., Mad Max's vest.","id":"p93"},{"ch":"Socialisation","q":"Socialization is…","o":["The lifelong process of learning attitudes, values and behaviors of a culture","Only childhood training","Inherited behavior","A type of punishment"],"a":0,"e":"It runs from infancy through retirement.","t":"Microsociology: learn how to behave; macrosociology: culture passes between generations.","id":"p94"},{"ch":"Socialisation","q":"From a macrosoc tored rubber bands on wrists.","id":"p108"},{"ch":"Socialisation","q":"Twins' differences in attitudes, values and mates suggest…","o":["Environmental influence","Pure heredity","Chance only","Plain luck"],"a":0,"e":"Similar temperament and nervous habits hint at heredity.","t":"So both genes and socialization matter.","id":"p109"},{"ch":"Socialisation","q":"The Minnesota Twin Family Study follows…","o":["137 sets of identical twins reared apart","13 sets","1,370 sets","3 sets"],"a":0,"e":"It examines personality, behavior and intelligence.","t":"IQ scores differ if twins' social environments differ dramatically.","id":"p110"},{"ch":"Socialisation","q":"A caution about twin studies is…","o":["Small samples and unknown contact between twins","They're too large","They lack twins","They ignore intelligence"],"a":0,"e":"Horgan (1993) and Plomin (1989) raise these concerns.","t":"A cited genetics-behavior study was retracted after resampling.","id":"p111"},{"ch":"Socialisation","q":"Who introduced the 'looking-glass self'?","o":["Charles Horton Cooley","George Herbert Mead","Erving Goffman","Jean Piaget"],"a":0,"e":"Early 1900s; the self is a product of social interaction.","t":"Cooley 1902.","id":"p112"},{"ch":"Socialisation","q":"Looking-glass self step 1:","o":["Imagine how we appear to others","Feel shame","Judge others","Ignore others"],"a":0,"e":"Then imagine their evaluation, then develop feelings (pride, shame).","t":"Three phases; the 'imagination' part is critical.","id":"p113"},{"ch":"Socialisation","q":"The looking-glass self may be wrong because…","o":["It's based on our imagination of others' views","Others always lie","It is genetic","It's measured"],"a":0,"e":"A student may wrongly decide a teacher thinks he is stupid.","t":"A good grade later can change that self-image.","id":"p114"},{"ch":"Socialisation","q":"Mead's three stages of the self are…","o":["Preparatory, play, game","Oral, anal, genital","Sensorimotor, operational","Family, school, peer"],"a" arents' kind of work.","id":"p122"},{"ch":"Socialisation","q":"Goffman is associated with…","o":["Impression management","Looking-glass self","Cognitive theory","Psychoanalysis"],"a":0,"e":"People slant their presentation of self for audiences.","t":"Goffman 1959.","id":"p123"},{"ch":"Socialisation","q":"Goffman's dramaturgical approach compares social life to…","o":["Theater","War","Machines","Markets"],"a":0,"e":"People are performers in action.","t":"A clerk looks busier when the supervisor watches.","id":"p124"},{"ch":"Socialisation","q":"Face-work is…","o":["Efforts to maintain a proper image and avoid embarrassment","Plastic surgery","Language","Studying"],"a":0,"e":"After rejection at a bar: 'no interesting person here.'","t":"Necessary for the unemployed too.","id":"p125"},{"ch":"Socialisation","q":"In Box 4-1, students who got high grades are called…","o":["Aces","Bombers","Rebels","Elites"],"a":0,"e":"Low graders are Bombers.","t":"Bomber–Bomber meetings include 'pity parties'.","id":"p126"},{"ch":"Socialisation","q":"Ace–Ace encounters are…","o":["Open; bragging is acceptable","Tense","Silent","Avoided"],"a":0,"e":"Comfort in sharing a high mark with another achiever.","t":"Ace–Bomber encounters are sensitive.","id":"p127"},{"ch":"Socialisation","q":"Freud emphasized…","o":["Inborn drives such as sexual gratification","Four stages of thought","Social class","Looking-glass"],"a":0,"e":"Impulses conflict with societal constraints.","t":"Austrian psychotherapist (1856–1939).","id":"p128"},{"ch":"Socialisation","q":"Piaget's first stage is the…","o":["Sensorimotor stage","Preoperational stage","Concrete operational stage","Formal stage"],"a":0,"e":"Children discover through senses that hands are part of themselves.","t":"Then preoperational → concrete → formal.","id":"p129"},{"ch":"Socialisation","q":"In which Piaget stage do children learn the clay lump and the snake are the same clay?","o":["Concrete operational","Sensorimotor","Preoperational","Formal oper s and evaluations; this is a conflict view.","t":"A struggling child can feel stupid.","id":"p137"},{"ch":"Socialisation","q":"Functionalists see schools as…","o":["Teaching the larger society's values and customs","Fostering inequality","Useless","Enemies of family"],"a":0,"e":"Conflict theorists agree but add they reinforce class divisions.","t":"Higher education's cost favors the affluent.","id":"p138"},{"ch":"Socialisation","q":"Peer groups assume the role of Mead's…","o":["Significant others","Generalized other","Total institution","Dramaturgy"],"a":0,"e":"Family becomes somewhat less important as a child grows.","t":"Peers are about the same age and social status.","id":"p139"},{"ch":"Socialisation","q":"Fatmeh's story illustrates…","o":["Peer groups torn apart by war","Workplace","Religion","School success"],"a":0,"e":"A Syrian teenager in a Lebanese shelter whose only outside link is her cell phone.","t":"Beaubien and Davis 2015.","id":"p140"},{"ch":"Socialisation","q":"What did both college men and women rank FIRST for boys' high-school popularity (Table 4-3)?","o":["Participation in sports","Car","Clothes","Popularity with girls"],"a":0,"e":"Both groups put sports first for boys; grades/intelligence came second for both.","t":"Data are from 1998 (Suitor et al. 2001).","id":"p141"},{"ch":"Socialisation","q":"The share of 12–17-year-olds on the Internet is…","o":["95%","50%","70%","30%"],"a":0,"e":"91% post photos with names; 92% use real names; 82% post birth dates.","t":"Socialization increasingly occurs online.","id":"p142"},{"ch":"Socialisation","q":"The American Academy of Pediatrics issued guidelines for the ___ of infants who use the Internet.","o":["90 percent","9 percent","40 percent","2 percent"],"a":0,"e":"Usually via parents.","t":"AAP 2011, 2013.","id":"p143"},{"ch":"Socialisation","q":"In the 'Unplugging the Media' study students abstained for…","o":["24 hours","7 days","1 hour","1 month"],"a":0,"e":"Beginning 2010, University of Maryland and S and afterschool programs from birth to age…","o":["12","5","18","3"],"a":0,"e":"Photo at Communicare, Perth.","t":"Compare the U.S. subsidy limits.","id":"e93"},{"ch":"Socialisation","q":"In Germany, reunification affected child care by…","o":["Reducing options for East German mothers","Increasing options","Banning care","Doing nothing"],"a":0,"e":"They were used to government-supported care.","t":"France considered cutting subsidized nurseries.","id":"e94"},{"ch":"Socialisation","q":"Most developing nations rely on…","o":["Relatives or taking children to work","Subsidies","Free nurseries","Boarding schools"],"a":0,"e":"They lack an economic base for subsidized care.","t":"Western Europe provides care at little cost.","id":"e95"},{"ch":"Socialisation","q":"Research suggests expanded child care…","o":["Raises parents' earnings and tax revenue that outweigh subsidies","Costs more always","Harms kids","Lowers wages"],"a":0,"e":"Together with reduced public assistance.","t":"Domeij and Klein 2013.","id":"e96"},{"ch":"Socialisation","q":"Feminists say child care gets little support because it is seen as…","o":["'Merely a way to let women work'","Too costly only","Illegal","Too popular"],"a":0,"e":"Conflict and feminist views echo each other here.","t":"97% of child care workers are women.","id":"e97"},{"ch":"Socialisation","q":"Table 4-3: college women ranked ___ first for what makes girls popular.","o":["Grades/intelligence","Physical attractiveness","Clothes","Sports"],"a":0,"e":"College men ranked physical attractiveness first.","t":"Both groups agree on several paths but rank them differently.","id":"e98"},{"ch":"Socialisation","q":"In the unplugging study, which country had the highest share (36%) citing benefits?","o":["Uganda","Argentina","United States","Slovakia"],"a":0,"e":"Argentina's was 16%.","t":"Box 4-3 figure.","id":"e99"},{"ch":"Socialisation","q":"What fraction of Amish youths accept the faith as adults?","o":["85 to 90 percent","20 to 30 percent","50 percent","99 percent"],"a":0,"e":"Most return and are baptized.","t":"Critics said 'Amish in the City' was exploitative.","id":"e100"},{"ch":"Socialisation","q":"Aces help Bombers save face by…","o":["Emphasizing the exam's difficulty and unfairness","Gloating","Ignoring","Reporting"],"a":0,"e":"Aces also rationalize their own 'lucky' scores.","t":"Bombers devise face-saving excuses.","id":"e101"},{"ch":"Socialisation","q":"People over 50 tend to view love as…","o":["Commitment with a practical approach","A game","Obsession","A duty only"],"a":0,"e":"Falling in love differs across the life course.","t":"Montgomery and Sorell 1997.","id":"e102"}];

const KEY = "soc_trainer_v1", CFG = "soc_trainer_cfg";
const LETTERS = ["A","B","C","D"];
let state = load();
let ui = { tab: "practice", pch: "All", pmode: "All", pidx: 0, pList: [], exam: null, rch: "All", rf: "All", rpage: 1 };

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.answers) return s; }catch(e){}
  return { answers:{}, marks:{}, exams:[] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function cfg(){ try{ return JSON.parse(localStorage.getItem(CFG))||{}; }catch(e){ return {}; } }
function saveCfg(c){ try{ localStorage.setItem(CFG, JSON.stringify(c)); }catch(e){} }

const ALL = [...PRACTICE, ...EXAM];
const BYID = Object.fromEntries(ALL.map(q=>[q.id,q]));

// stable per-question shuffle so answer positions are not predictable
function order(q){
  let h = 2166136261;
  for(const c of q.id){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const a = [0,1,2,3];
  for(let i=3;i>0;i--){ h = Math.imul(h ^ (h>>>15), 2246822519) + 374761393 | 0; const j = Math.abs(h) % (i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tabs(){
  const t = [["practice","Practice"],["exam","Exam"],["review","Review"],["backup","Backup"]];
  document.getElementById("nav").innerHTML = t.map(([k,l])=>`<button class="${ui.tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
}
function go(t){ ui.tab = t; render(); window.scrollTo(0,0); }
function render(){ tabs(); ({practice:rPractice, exam:rExam, review:rReview, backup:rBackup})[ui.tab](); }

/* ---------- PRACTICE ---------- */
function pFilter(){
  return PRACTICE.filter(q=>{
    if(ui.pch!=="All" && q.ch!==ui.pch) return false;
    const a = state.answers[q.id];
    if(ui.pmode==="Unanswered") return !a;
    if(ui.pmode==="Wrong") return a && !a.ok;
    if(ui.pmode==="Saved") return state.marks[q.id];
    return true;
  });
}
function setP(k,v){ ui[k]=v; ui.pidx=0; render(); }
function rPractice(){
  const list = pFilter(); ui.pList = list;
  if(ui.pidx >= list.length) ui.pidx = Math.max(0, list.length-1);
  const done = PRACTICE.filter(q=>state.answers[q.id]).length;
  const right = PRACTICE.filter(q=>state.answers[q.id] && state.answers[q.id].ok).length;
  let h = `<div class="card"><div class="row">
    ${["All","Culture","Socialisation"].map(c=>`<button class="pill ${ui.pch===c?"on":""}" onclick="setP('pch','${c}')">${c}</button>`).join("")}
    <span class="sp"></span>
    ${["All","Unanswered","Wrong","Saved"].map(c=>`<button class="pill ${ui.pmode===c?"on":""}" onclick="setP('pmode','${c}')">${c}</button>`).join("")}
  </div>
  <div class="row" style="margin-top:12px"><div class="sp"><div class="bar"><i style="width:${done/PRACTICE.length*100}%"></i></div></div>
  <span class="muted">${done}/${PRACTICE.length} done · ${done?Math.round(right/done*100):0}% correct</span></div></div>`;
  if(!list.length){ h += `<div class="card"><p class="muted">No questions match this filter.</p></div>`; app(h); return; }
  const q = list[ui.pidx];
  h += qCard(q, { idx: ui.pidx, total: list.length, reveal: !!state.answers[q.id], pick:"pick" });
  h += `<div class="row"><button class="btn sec" onclick="pmove(-1)" ${ui.pidx===0?"disabled":""}>← Prev</button><span class="sp"></span>
  <button class="btn" onclick="pmove(1)" ${ui.pidx>=list.length-1?"disabled":""}>Next →</button></div>`;
  h += `<div class="card" style="margin-top:14px"><b>Jump to</b><div class="grid">${list.map((x,i)=>{
    const a=state.answers[x.id]; return `<button class="dot ${i===ui.pidx?"cur":""} ${a?(a.ok?"ok":"bad"):""}" onclick="ui.pidx=${i};render()">${i+1}</button>`;}).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn red" onclick="resetPractice()">Reset practice progress</button></div></div>`;
  app(h);
}
function pmove(d){ ui.pidx = Math.min(ui.pList.length-1, Math.max(0, ui.pidx+d)); render(); window.scrollTo(0,0); }
function pick(id, oi){
  if(state.answers[id]) return;
  const q = BYID[id];
  state.answers[id] = { sel: oi, ok: oi===q.a, t: Date.now() };
  save(); render();
}
function star(id){ if(state.marks[id]) delete state.marks[id]; else state.marks[id]=1; save(); render(); }
function resetPractice(){
  if(!confirm("Clear all practice answers? (Exam history is kept.)")) return;
  PRACTICE.forEach(q=>delete state.answers[q.id]); save(); ui.pidx=0; render();
}

function qCard(q, o){
  const a = state.answers[q.id] || (o.examSel!==undefined && o.examSel!==null ? {sel:o.examSel} : null);
  const ord = order(q);
  const reveal = o.reveal;
  let h = `<div class="card"><div class="row"><span class="tag">${q.ch}</span><span class="muted">${o.idx!==undefined?`Q ${o.idx+1} / ${o.total}`:""}</span><span class="sp"></span>
  <button class="star ${state.marks[q.id]?"on":""}" title="Save for later" onclick="star('${q.id}')">★</button></div>
  <div class="q">${esc(q.q)}</div>`;
  ord.forEach((oi,k)=>{
    let cls="";
    const chosen = a && a.sel===oi;
    if(reveal){ if(oi===q.a) cls="ok"; else if(chosen) cls="bad"; }
    else if(chosen) cls="sel";
    h += `<button class="opt ${cls}" ${reveal?"disabled":""} onclick="${o.pick}('${q.id}',${oi})"><b>${LETTERS[k]}</b>${esc(q.o[oi])}</button>`;
  });
  if(reveal){
    h += `<div class="exp"><div class="e"><small>${a && a.sel===q.a ? "✔ Correct — why" : "✘ Correct answer: "+LETTERS[ord.indexOf(q.a)]+" — why"}</small>${esc(q.e)}</div>
    <div class="t"><small>💡 Tip / extra info</small>${esc(q.t)}</div></div>`;
  }
  return h + `</div>`;
}

/* ---------- EXAM ---------- */
const EXAM_MIN = 60;
function rExam(){
  const ex = ui.exam;
  if(!ex){
    const hist = state.exams.slice(-5).reverse();
    app(`<div class="card"><h2>Exam set</h2>
      <p>${EXAM.length} fresh questions (Culture + Socialisation) — none of them appear in the practice set. ${EXAM_MIN} minutes, no feedback until you submit.</p>
      <button class="btn" onclick="startExam()">Start exam</button></div>
      <div class="card"><h2>Recent attempts</h2>${hist.length?hist.map(e=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${new Date(e.date).toLocaleString()}</span><span class="sp"></span><b>${e.score}/${e.total}</b><span class="muted">${Math.round(e.score/e.total*100)}% · ${e.mins} min</span></div>`).join(""):`<p class="muted">No attempts yet.</p>`}</div>`);
    return;
  }
  if(ex.done) return rExamResult();
  const q = ex.qs[ex.i];
  const left = Math.max(0, ex.end - Date.now());
  let h = `<div class="card"><div class="row"><b>Exam in progress</b><span class="sp"></span><span class="timer ${left<300000?"low":""}" id="tm">${fmt(left)}</span></div>
   <div class="muted">${ex.sel.filter(x=>x!==null).length}/${ex.qs.length} answered</div></div>`;
  h += qCard(q,{idx:ex.i,total:ex.qs.length,reveal:false,pick:"examPick",examSel:ex.sel[ex.i]});
  h += `<div class="row"><button class="btn sec" onclick="emove(-1)" ${ex.i===0?"disabled":""}>← Prev</button><span class="sp"></span>
   <button class="btn" onclick="emove(1)" ${ex.i>=ex.qs.length-1?"disabled":""}>Next →</button></div>
   <div class="card" style="margin-top:14px"><div class="grid">${ex.qs.map((x,i)=>`<button class="dot ${i===ex.i?"cur":""} ${ex.sel[i]!==null?"ans":""}" onclick="ui.exam.i=${i};render()">${i+1}</button>`).join("")}</div>
   <div class="row" style="margin-top:12px"><button class="btn" onclick="finishExam()">Submit exam</button><button class="btn red" onclick="quitExam()">Quit</button></div></div>`;
  app(h);
}
function fmt(ms){ const s=Math.ceil(ms/1000),m=Math.floor(s/60); return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let tick=null;
function startExam(){
  const qs = shuf(EXAM);
  ui.exam = { qs, sel: qs.map(()=>null), i:0, start:Date.now(), end:Date.now()+EXAM_MIN*60000, done:false };
  clearInterval(tick);
  tick = setInterval(()=>{
    const ex=ui.exam; if(!ex||ex.done||ui.tab!=="exam"){ if(!ex||ex.done) clearInterval(tick); return; }
    const left=ex.end-Date.now(); const el=document.getElementById("tm");
    if(left<=0){ finishExam(true); return; }
    if(el){ el.textContent=fmt(left); el.classList.toggle("low", left<300000); }
  },1000);
  render();
}
function examPick(id, oi){ const ex=ui.exam; ex.sel[ex.i]=oi; render(); }
function emove(d){ ui.exam.i+=d; render(); window.scrollTo(0,0); }
function finishExam(auto){
  const ex=ui.exam;
  if(!auto){ const un=ex.sel.filter(x=>x===null).length; if(un && !confirm(un+" unanswered. Submit anyway?")) return; }
  let score=0;
  ex.qs.forEach((q,i)=>{ const s=ex.sel[i]; if(s!==null){ const ok=s===q.a; if(ok) score++; state.answers[q.id]={sel:s,ok,t:Date.now()}; } });
  ex.score=score; ex.done=true; ex.mins=Math.max(1,Math.round((Date.now()-ex.start)/60000));
  state.exams.push({date:Date.now(),score,total:ex.qs.length,mins:ex.mins});
  save(); clearInterval(tick); render();
}
function quitExam(){ if(confirm("Quit this attempt? Answers will be lost.")){ clearInterval(tick); ui.exam=null; render(); } }
function rExamResult(){
  const ex=ui.exam; const pct=Math.round(ex.score/ex.qs.length*100);
  const by = ch=>{ const l=ex.qs.map((q,i)=>[q,ex.sel[i]]).filter(([q])=>q.ch===ch); return l.filter(([q,s])=>s===q.a).length+"/"+l.length; };
  let h=`<div class="card"><h2>Result: ${ex.score} / ${ex.qs.length} (${pct}%)</h2><div class="stats">
    <div class="stat"><b>${by("Culture")}</b><span>Culture</span></div><div class="stat"><b>${by("Socialisation")}</b><span>Socialisation</span></div>
    <div class="stat"><b>${ex.mins} min</b><span>Time</span></div></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="ui.exam=null;render()">Back</button><button class="btn sec" onclick="startExam()">Retake</button></div></div>`;
  ex.qs.forEach((q,i)=>{ const s=ex.sel[i]; h += `<div class="rv ${s===q.a?"ok":"bad"}" style="border-radius:14px">`+qCard(q,{idx:i,total:ex.qs.length,reveal:true,pick:"noop",examSel:s})+`</div>`; });
  app(h);
}
function noop(){}

/* ---------- REVIEW ---------- */
function rReview(){
  let l = ALL.filter(q=>state.answers[q.id]);
  const total=l.length, wrong=l.filter(q=>!state.answers[q.id].ok).length;
  if(ui.rch!=="All") l=l.filter(q=>q.ch===ui.rch);
  if(ui.rf==="Wrong") l=l.filter(q=>!state.answers[q.id].ok);
  if(ui.rf==="Correct") l=l.filter(q=>state.answers[q.id].ok);
  if(ui.rf==="Saved") l=ALL.filter(q=>state.marks[q.id] && (ui.rch==="All"||q.ch===ui.rch));
  const per=20, pages=Math.max(1,Math.ceil(l.length/per)); if(ui.rpage>pages) ui.rpage=pages;
  const slice=l.slice((ui.rpage-1)*per, ui.rpage*per);
  let h=`<div class="card"><h2>Review everything</h2><div class="stats">
    <div class="stat"><b>${total}</b><span>answered</span></div><div class="stat"><b>${total-wrong}</b><span>correct</span></div>
    <div class="stat"><b>${wrong}</b><span>wrong</span></div><div class="stat"><b>${Object.keys(state.marks).length}</b><span>saved ★</span></div></div>
    <div class="row" style="margin-top:12px">${["All","Culture","Socialisation"].map(c=>`<button class="pill ${ui.rch===c?"on":""}" onclick="ui.rch='${c}';ui.rpage=1;render()">${c}</button>`).join("")}<span class="sp"></span>
    ${["All","Wrong","Correct","Saved"].map(c=>`<button class="pill ${ui.rf===c?"on":""}" onclick="ui.rf='${c}';ui.rpage=1;render()">${c}</button>`).join("")}</div></div>`;
  if(!slice.length) h+=`<div class="card"><p class="muted">Nothing to show yet — answer some questions in Practice or take the Exam.</p></div>`;
  slice.forEach((q,i)=>{ const a=state.answers[q.id]; h+=`<div class="rv ${a?(a.ok?"ok":"bad"):""}" style="border-radius:14px">`+qCard(q,{idx:(ui.rpage-1)*per+i,total:l.length,reveal:true,pick:"noop",examSel:a?a.sel:null})+`</div>`; });
  if(pages>1) h+=`<div class="row"><button class="btn sec" ${ui.rpage<=1?"disabled":""} onclick="ui.rpage--;render();scrollTo(0,0)">← Prev</button><span class="sp muted" style="text-align:center">Page ${ui.rpage}/${pages}</span><button class="btn sec" ${ui.rpage>=pages?"disabled":""} onclick="ui.rpage++;render();scrollTo(0,0)">Next →</button></div>`;
  app(h);
}

/* ---------- BACKUP (JSONBin) ---------- */
let bmsg = null;
function rBackup(){
  const c=cfg();
  app(`<div class="card"><h2>Cloud backup (JSONBin)</h2>
    <p class="muted">Add your own JSONBin keys. They are stored only in this browser. <b>Push</b> uploads your progress; <b>Pull</b> downloads it and replaces what is on this device.</p>
    <label>Master Key (X-Master-Key)</label><input type="password" id="mk" value="${esc(c.key||"")}" placeholder="$2a$10$...">
    <label>Bin ID</label><input type="text" id="bid" value="${esc(c.bin||"")}" placeholder="e.g. 6650f1e3ad19ca34f8..." >
    <div class="row"><button class="btn" onclick="push()">⬆ Push to JSONBin</button><button class="btn sec" onclick="pull()">⬇ Pull from JSONBin</button><button class="btn sec" onclick="saveKeys()">Save keys</button></div>
    ${bmsg?`<div class="msg ${bmsg[0]}">${esc(bmsg[1])}</div>`:""}</div>
    <div class="card"><h2>File backup</h2><p class="muted">Works without any keys.</p>
    <div class="row"><button class="btn sec" onclick="exportFile()">Download .json</button><label class="btn sec" style="cursor:pointer;margin:0">Import .json<input type="file" accept=".json" hidden onchange="importFile(event)"></label></div></div>
    <div class="card"><h2>Danger zone</h2><button class="btn red" onclick="wipe()">Erase all progress on this device</button></div>`);
}
function readKeys(){ const k=document.getElementById("mk").value.trim(), b=document.getElementById("bid").value.trim(); saveCfg({key:k,bin:b}); return {k,b}; }
function saveKeys(){ readKeys(); bmsg=["ok","Keys saved on this device."]; rBackup(); }
function payload(){ return { app:"soc-trainer", v:1, savedAt:new Date().toISOString(), answers:state.answers, marks:state.marks, exams:state.exams }; }
async function push(){
  const {k,b}=readKeys(); if(!k||!b){ bmsg=["err","Enter your Master Key and Bin ID first."]; return rBackup(); }
  bmsg=["inf","Uploading…"]; rBackup();
  try{
    const r=await fetch("https://api.jsonbin.io/v3/b/"+encodeURIComponent(b),{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":k},body:JSON.stringify(payload())});
    if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
    bmsg=["ok","Pushed ✔ "+Object.keys(state.answers).length+" answers saved."];
  }catch(e){ bmsg=["err","Push failed: "+e.message]; }
  rBackup();
}
async function pull(){
  const {k,b}=readKeys(); if(!k||!b){ bmsg=["err","Enter your Master Key and Bin ID first."]; return rBackup(); }
  bmsg=["inf","Downloading…"]; rBackup();
  try{
    const r=await fetch("https://api.jsonbin.io/v3/b/"+encodeURIComponent(b)+"/latest",{headers:{"X-Master-Key":k}});
    if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
    const j=await r.json(), rec=j.record;
    if(!rec||!rec.answers) throw new Error("This bin has no saved progress yet — push first.");
    if(!confirm("Replace progress on this device with the cloud copy ("+Object.keys(rec.answers).length+" answers, saved "+(rec.savedAt||"?")+")?")){ bmsg=["inf","Pull cancelled."]; return rBackup(); }
    state={answers:rec.answers||{},marks:rec.marks||{},exams:rec.exams||[]}; save();
    bmsg=["ok","Pulled ✔ progress restored."];
  }catch(e){ bmsg=["err","Pull failed: "+e.message]; }
  rBackup();
}
function exportFile(){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,1)],{type:"application/json"}));
  a.download="sociology-progress.json"; a.click();
}
function importFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.answers) throw 0;
    state={answers:j.answers,marks:j.marks||{},exams:j.exams||[]}; save(); bmsg=["ok","Imported ✔"]; }catch(e){ bmsg=["err","Not a valid progress file."]; } rBackup(); };
  r.readAsText(f);
}
function wipe(){ if(confirm("Erase ALL progress on this device?")){ state={answers:{},marks:{},exams:[]}; save(); bmsg=["ok","Progress erased."]; rBackup(); } }

function app(h){ document.getElementById("app").innerHTML=h; }
render();
</script>
</body>
</html>
